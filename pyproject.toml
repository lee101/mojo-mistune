[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-mistune"
version = "0.1.0"
description = "Mistune-compatible Markdown parsing and HTML rendering in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Lee Penkman", email = "leepenkman@gmail.com"}]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
